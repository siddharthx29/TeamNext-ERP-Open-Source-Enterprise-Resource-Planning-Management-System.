databases:
  # NOTE: Render's "free" tier PostgreSQL expires and is purged after 30 days.
  # For permanent enterprise persistence, use the "starter" or higher plan.
  - name: teamnext-db
    databaseName: teamnext
    user: teamnext
    plan: starter

services:
  - type: web
    name: teamnext-app
    env: python
    plan: starter
    rootDir: Teamnext
    buildCommand: "bash ./build.sh"
    startCommand: "bash ./deploy.sh && gunicorn project.wsgi:application"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teamnext-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: WEEKLY_BACKUP_RETENTION
        value: "12"
      - key: MONTHLY_BACKUP_RETENTION
        value: "12"
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: otp@teamnexterp.com
      - key: DEBUG
        value: "False"

