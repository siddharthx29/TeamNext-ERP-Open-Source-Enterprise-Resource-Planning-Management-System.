{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JETS327R52"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-JETS327R52');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - TeamNext ERP</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'myapp/images/logo.svg' %}">
    <link rel="stylesheet" href="/static/myapp/css/theme.css">
    <link rel="stylesheet" href="/static/myapp/css/responsive.css">
    <script src="/static/myapp/js/theme.js"></script>
    <style>
        .strength-meter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 6px;
            margin-bottom: 8px;
        }

        .strength-segment {
            height: 3px;
            background: rgba(203, 213, 225, 0.6);
            border-radius: 2px;
            transition: background-color 0.25s ease;
        }

        .strength-text-label {
            font-size: 11px;
            color: #64748B;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body class="auth-layout">
    <div class="erp-3d-background" aria-hidden="true"></div>

    <div class="modal-card" style="max-width: 440px; border-radius: 16px;">
        <div style="padding: 24px; text-align: center; border-bottom: 1px solid var(--border-subtle);">
            <div class="brand-logo" style="margin: 0 auto 10px auto; width: 34px; height: 34px; font-size: 13px;">TN
            </div>
            <div style="font-size: 17px; font-weight: 700; color: var(--text-primary);">Create New Password</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Choose a secure password for your
                workspace account</div>
        </div>

        <div style="padding: 24px;">
            {% if messages %}
            {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" action="/set-password/">
                {% csrf_token %}
                <div class="form-group">
                    <label>New Password</label>
                    <input name="password" type="password" placeholder="Enter new password" id="password" required
                        autocomplete="new-password">
                    <div class="strength-meter-grid">
                        <div class="strength-segment" id="seg-1"></div>
                        <div class="strength-segment" id="seg-2"></div>
                        <div class="strength-segment" id="seg-3"></div>
                        <div class="strength-segment" id="seg-4"></div>
                    </div>
                    <div class="strength-text-label">
                        <span>Security level</span>
                        <span id="strength-label" style="font-weight: 600;">Too weak</span>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 14px;">
                    <label>Confirm New Password</label>
                    <input name="confirm_password" type="password" placeholder="Confirm new password" required
                        autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; padding: 10px; margin-top: 6px;">Update Password</button>
            </form>

            <div style="text-align: center; margin-top: 18px;">
                <a href="/"
                    style="color: var(--primary-accent); font-size: 12px; text-decoration: none; font-weight: 500;">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const seg1 = document.getElementById('seg-1');
        const seg2 = document.getElementById('seg-2');
        const seg3 = document.getElementById('seg-3');
        const seg4 = document.getElementById('seg-4');
        const strengthLabel = document.getElementById('strength-label');

        if (passwordInput) {
            passwordInput.addEventListener('input', function () {
                const password = this.value;
                let score = 0;

                if (password.length >= 8) score++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^A-Za-z0-9]/.test(password)) score++;

                const defaultColor = 'rgba(203, 213, 225, 0.6)';
                seg1.style.background = defaultColor;
                seg2.style.background = defaultColor;
                seg3.style.background = defaultColor;
                seg4.style.background = defaultColor;

                if (score === 0) {
                    strengthLabel.textContent = 'Too weak';
                    strengthLabel.style.color = '#94A3B8';
                } else if (score === 1) {
                    seg1.style.background = '#EF4444';
                    strengthLabel.textContent = 'Weak';
                    strengthLabel.style.color = '#EF4444';
                } else if (score === 2) {
                    seg1.style.background = '#F59E0B';
                    seg2.style.background = '#F59E0B';
                    strengthLabel.textContent = 'Fair';
                    strengthLabel.style.color = '#F59E0B';
                } else if (score === 3) {
                    seg1.style.background = '#3B82F6';
                    seg2.style.background = '#3B82F6';
                    seg3.style.background = '#3B82F6';
                    strengthLabel.textContent = 'Good';
                    strengthLabel.style.color = '#3B82F6';
                } else {
                    seg1.style.background = '#10B981';
                    seg2.style.background = '#10B981';
                    seg3.style.background = '#10B981';
                    seg4.style.background = '#10B981';
                    strengthLabel.textContent = 'Strong';
                    strengthLabel.style.color = '#10B981';
                }
            });
        }
    </script>
</body>

</html>
